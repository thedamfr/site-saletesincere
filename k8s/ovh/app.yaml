apiVersion: v1
kind: ConfigMap
metadata:
  name: site-saletesincere-env
data:
  NODE_ENV: production
  PORT: "3000"
  DISABLE_STORAGE: "true"
  DISABLE_WALL: "true"
---
apiVersion: v1
kind: Service
metadata:
  name: site-saletesincere
  labels:
    app.kubernetes.io/name: site-saletesincere
    app.kubernetes.io/component: web
spec:
  ports:
    - name: http
      appProtocol: http
      port: 3000
      protocol: TCP
      targetPort: http
  selector:
    app.kubernetes.io/name: site-saletesincere
    app.kubernetes.io/component: web
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: site-saletesincere
  labels:
    app.kubernetes.io/name: site-saletesincere
    app.kubernetes.io/component: web
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: site-saletesincere
      app.kubernetes.io/component: web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: site-saletesincere
        app.kubernetes.io/component: web
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: web
          image: site-saletesincere:staging-20260909-2
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: site-saletesincere-env
            - secretRef:
                name: site-saletesincere-app
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: site-saletesincere-database
                  key: DATABASE_URL
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      terminationGracePeriodSeconds: 30
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
