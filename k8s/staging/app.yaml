apiVersion: v1
kind: ConfigMap
metadata:
  name: site-saletesincere-staging-env
data:
  NODE_ENV: production
  PORT: "3000"
  DISABLE_STORAGE: "true"
  DISABLE_WALL: "true"
  DISABLE_WORKER: "false"
  SALENEWS_PUBLIC_BASEURL: https://staging.saletesincere.fr
  BREVO_BASEURL: http://site-saletesincere-staging-brevo:3000/v3
  BREVO_API_KEY: staging-sandbox-only
  BREVO_LIST_ID: "1"
---
apiVersion: v1
kind: Service
metadata:
  name: site-saletesincere-staging
  labels:
    app.kubernetes.io/name: site-saletesincere-staging
    app.kubernetes.io/component: staging-web
spec:
  ports:
    - name: http
      appProtocol: http
      port: 3000
      protocol: TCP
      targetPort: http
  selector:
    app.kubernetes.io/name: site-saletesincere-staging
    app.kubernetes.io/component: staging-web
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: site-saletesincere-staging
  labels:
    app.kubernetes.io/name: site-saletesincere-staging
    app.kubernetes.io/component: staging-web
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: site-saletesincere-staging
      app.kubernetes.io/component: staging-web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: site-saletesincere-staging
        app.kubernetes.io/component: staging-web
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: web
          image: ghcr.io/thedamfr/site-saletesincere:bootstrap-required
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: site-saletesincere-staging-env
            - secretRef:
                name: site-saletesincere-staging-app
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: site-saletesincere-staging-database
                  key: DATABASE_URL
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            exec:
              command: [node, scripts/delivery/readiness.mjs]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      terminationGracePeriodSeconds: 30
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
