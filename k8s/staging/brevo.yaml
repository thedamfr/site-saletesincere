apiVersion: v1
kind: ConfigMap
metadata:
  name: site-saletesincere-staging-brevo
data:
  server.mjs: |
    import http from 'node:http';
    // Isolated fake Brevo: bounded in-memory counters, no mail and no network egress.
    let contacts = 0;
    http.createServer((request, response) => {
      if (request.method === 'GET' && request.url === '/health') {
        response.setHeader('Content-Type', 'application/json');
        return response.end(JSON.stringify({ sandbox: true, contacts }));
      }
      if (request.method !== 'POST' || request.url !== '/v3/contacts' || request.headers['api-key'] !== 'staging-sandbox-only') {
        response.writeHead(404); return response.end();
      }
      let body = '';
      request.on('data', chunk => { body += chunk; if (body.length > 8192) request.destroy(); });
      request.on('end', () => {
        try {
          const data = JSON.parse(body);
          if (!data.email || data.listIds?.[0] !== 1) throw new Error();
          contacts += 1;
          response.writeHead(201, { 'Content-Type': 'application/json' });
          response.end(JSON.stringify({ id: contacts }));
        } catch { response.writeHead(400); response.end(); }
      });
    }).listen(3000, '0.0.0.0');
---
apiVersion: v1
kind: Service
metadata:
  name: site-saletesincere-staging-brevo
spec:
  selector:
    app.kubernetes.io/component: staging-sandbox
  ports:
    - {name: http, port: 3000, targetPort: 3000}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: site-saletesincere-staging-brevo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: staging-sandbox
  template:
    metadata:
      labels:
        app.kubernetes.io/component: staging-sandbox
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: sandbox
          image: node:24-slim
          command: [node, /sandbox/server.mjs]
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 100m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          readinessProbe:
            httpGet: {path: /health, port: 3000}
          volumeMounts:
            - {name: sandbox, mountPath: /sandbox, readOnly: true}
      volumes:
        - name: sandbox
          configMap: {name: site-saletesincere-staging-brevo}
