<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 498.62 413.65">
  <defs>
    <style>
      .logo-trace {
        fill: none;
        stroke: #000;
        stroke-linecap: butt;
        stroke-linejoin: round;
        stroke-dasharray: 1 2;
        stroke-dashoffset: 0;
      }
      .logo-trace-main { stroke-width: 140; }
      .logo-trace-small-loop { stroke-width: 98; }
      .logo-trace-return { stroke-width: 110; }
      .logo-dot { transform-box: fill-box; transform-origin: center; }

      @keyframes logo-draw-main {
        0% { stroke-dashoffset: 1.0001; }
        36%, 100% { stroke-dashoffset: 0; }
      }
      @keyframes logo-draw-small-loop {
        0%, 36% { stroke-dashoffset: 1.0001; }
        52%, 100% { stroke-dashoffset: 0; }
      }
      @keyframes logo-draw-return {
        0%, 52% { stroke-dashoffset: 1.0001; }
        96%, 100% { stroke-dashoffset: 0; }
      }
      @keyframes logo-dot {
        0%, 96% { opacity: 0; transform: scale(.5); }
        100% { opacity: 1; transform: scale(1); }
      }
      @media (prefers-reduced-motion: no-preference) {
        .logo-trace-main { animation: logo-draw-main 3.6s linear both; }
        .logo-trace-small-loop { animation: logo-draw-small-loop 3.6s linear both; }
        .logo-trace-return { animation: logo-draw-return 3.6s linear both; }
        .logo-dot { animation: logo-dot 3.6s ease-out both; }
      }
      /* The lab pauses these same animations, including when reduced motion is on. */
      [data-logo-lab] .logo-trace-main { animation: logo-draw-main 3.6s linear both; }
      [data-logo-lab] .logo-trace-small-loop { animation: logo-draw-small-loop 3.6s linear both; }
      [data-logo-lab] .logo-trace-return { animation: logo-draw-return 3.6s linear both; }
      [data-logo-lab] .logo-dot { animation: logo-dot 3.6s ease-out both; }
    </style>
