<?xml version="1.0" encoding="UTF-8"?>
<svg id="Calque_1" data-name="Calque 1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 498.62 413.65">
  <defs>
    <style>
      .logo-trace {
        fill: none;
        stroke: #fff;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dashoffset: 0;
      }

      .logo-trace-upper {
        stroke-width: 72;
        stroke-linecap: butt;
        stroke-dasharray: 446;
      }

      .logo-trace-upper-fill {
        stroke-width: 132;
        stroke-dasharray: 342;
      }

      .logo-trace-upper-mid {
        stroke-width: 100;
        stroke-dasharray: 361;
      }

      .logo-trace-loop {
        stroke-width: 82;
        stroke-dasharray: 356;
      }

      .logo-trace-return {
        stroke-width: 116;
        stroke-dasharray: 403;
      }

      .logo-dot {
        transform-box: fill-box;
        transform-origin: center;
      }

      .logo-reveal-finish {
        opacity: 1;
      }

      @keyframes logo-draw-upper {
        0% { stroke-dashoffset: 446; }
        40%, 100% { stroke-dashoffset: 0; }
      }

      @keyframes logo-draw-upper-fill {
        0% { stroke-dashoffset: 342; }
        28%, 100% { stroke-dashoffset: 0; }
      }

      @keyframes logo-draw-upper-mid {
        0% { stroke-dashoffset: 361; }
        34%, 100% { stroke-dashoffset: 0; }
      }

      @keyframes logo-draw-loop {
        0%, 38% { stroke-dashoffset: 356; }
        64%, 100% { stroke-dashoffset: 0; }
      }

      @keyframes logo-draw-return {
        0%, 62% { stroke-dashoffset: 403; }
        96%, 100% { stroke-dashoffset: 0; }
      }

      @keyframes logo-dot {
        0%, 92% { opacity: 0; transform: translate(-12px, 10px) scale(.35); }
        97% { opacity: 1; transform: translate(0, 0) scale(1.12); }
        100% { opacity: 1; transform: translate(0, 0) scale(1); }
      }

      @keyframes logo-finish {
        0%, 96% { opacity: 0; }
        100% { opacity: 1; }
      }

      @media (prefers-reduced-motion: no-preference) {
        .logo-trace-upper {
          animation: logo-draw-upper 3.6s cubic-bezier(.45, 0, .2, 1) both;
        }

        .logo-trace-upper-fill {
          animation: logo-draw-upper-fill 3.6s cubic-bezier(.45, 0, .2, 1) both;
        }

        .logo-trace-upper-mid {
          animation: logo-draw-upper-mid 3.6s cubic-bezier(.45, 0, .2, 1) both;
        }

        .logo-trace-loop {
          animation: logo-draw-loop 3.6s cubic-bezier(.45, 0, .2, 1) both;
        }

        .logo-trace-return {
          animation: logo-draw-return 3.6s cubic-bezier(.45, 0, .2, 1) both;
        }

        .logo-dot {
          opacity: 0;
          animation: logo-dot 3.6s cubic-bezier(.18, .89, .32, 1.28) both;
        }

        .logo-reveal-finish {
          opacity: 0;
          animation: logo-finish 3.6s cubic-bezier(0, 0, .2, 1) both;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .logo-trace {
          animation: none;
          stroke-dashoffset: 0;
        }

        .logo-dot {
          animation: none;
          opacity: 1;
          transform: none;
        }

        .logo-reveal-finish {
          animation: none;
          opacity: 1;
        }

      }
    </style>

