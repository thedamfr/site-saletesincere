name: Validate and publish
run-name: ${{ inputs.environment || 'production' }} · ${{ github.ref_name }}
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [staging, production]
        default: staging
        description: Environnement à livrer (production exige main)
      force_build:
        type: boolean
        default: false
        description: Reconstruire même si les entrées sont identiques
permissions:
  contents: read
concurrency:
  group: validate-publish-${{ github.event.pull_request.number || github.ref }}-${{ inputs.environment || 'production' }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: delivery_test
          POSTGRES_PASSWORD: disposable_ci_only
          POSTGRES_DB: delivery_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U delivery_test -d delivery_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Verify migrations on disposable PostgreSQL, including repeat execution
        env:
          DATABASE_URL: postgresql://delivery_test:disposable_ci_only@127.0.0.1:5432/delivery_test
        run: |
          npm run migrate
          npm run migrate
      - name: Render Kubernetes configuration and check whitespace
        run: |
          kubectl kustomize k8s/ovh > /tmp/bootstrap.yaml
          kubectl kustomize k8s/staging > /tmp/staging.yaml
          git diff --check
  publish:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      packages: write
    env:
      DELIVERY_ENVIRONMENT: ${{ inputs.environment || 'production' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Compare all inputs with previously validated artifacts
        id: prepare
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_BUILD: ${{ inputs.force_build }}
        run: node scripts/delivery/prepare.mjs
      - uses: docker/setup-buildx-action@v3
        if: steps.prepare.outputs.build == 'true'
      - uses: docker/login-action@v3
        if: steps.prepare.outputs.build == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: image
        if: steps.prepare.outputs.build == 'true'
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
          build-args: SOURCE_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record immutable release and public asset fingerprint
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { hash, validateRelease } from './scripts/delivery/policy.mjs';
          const release = JSON.parse(fs.readFileSync('release.json'));
          if (process.env.IMAGE_DIGEST) release.digest = process.env.IMAGE_DIGEST;
          release.cssHash = hash(fs.readFileSync('public/style.css'));
          validateRelease(release);
          fs.writeFileSync('release.json', JSON.stringify(release, null, 2));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `### Image validée — ${release.environment}\n\nCommit évalué : ${release.assessedCommit}\n\nSource image : ${release.imageCommit}\n\nDigest : ${release.digest}\n\nL'activation et la recette OVH sont suivies par le statut OVH et le workflow Verify OVH delivery.\n`);
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: delivery-${{ env.DELIVERY_ENVIRONMENT }}
          path: release.json
          retention-days: 90
      - name: Publish public delivery intent (OVH requires no GitHub token)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/delivery/publish-state.mjs
